[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasgan-flow-reconstruction"
version = "0.1.0"
description = "TensorFlow conditional relativistic GAN for POD-to-reference flow-field reconstruction"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kaku E. Eduku" }
]
keywords = [
  "tensorflow",
  "generative-adversarial-network",
  "scientific-machine-learning",
  "flow-field-reconstruction",
  "super-resolution",
  "proper-orthogonal-decomposition"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "tensorflow>=2.17,<2.22",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "h5py>=3.10,<4"
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8,<4"]
dev = [
  "matplotlib>=3.8,<4",
  "pytest>=8,<10",
  "build>=1.2,<2"
]

[project.scripts]
rasgan-train = "rasgan.cli.train:main"
rasgan-infer = "rasgan.cli.infer:main"
rasgan-prepare-data = "rasgan.cli.preprocess:main"
rasgan-inspect-data = "rasgan.cli.inspect_data:main"
rasgan-selfcheck = "rasgan.selfcheck:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "tensorflow: requires a working TensorFlow installation"
]
addopts = "-ra"
